name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://radiohub_e2e:test-only@127.0.0.1:15432/radiohub_e2e
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Check, test and build backend
        run: npm run check && npm test && npm run build
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Check, test and build frontend
        run: npm run check && npm test && npm run build
        working-directory: frontend
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
