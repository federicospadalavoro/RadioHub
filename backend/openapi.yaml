openapi: 3.1.0
info:
  title: RadioHub API
  version: 1.0.0
  description: API del backend RadioHub per radio, notizie, account e preferiti.
servers:
  - url: /
    description: Stesso indirizzo della pagina API, in locale e online
tags:
  - name: Stato
  - name: Radio
  - name: Notizie
  - name: AI
  - name: Account
  - name: Preferiti
paths:
  /api/health:
    get:
      tags: [Stato]
      summary: Verifica backend, PostgreSQL e Redis
      description: Esegue SELECT 1 su PostgreSQL e PING su Redis con timeout SERVICE_TIMEOUT_MS. La risposta non viene memorizzata in cache.
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Entrambi i servizi rispondono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { status: OK, checks: { postgres: OK, redis: OK } }
        "503":
          description: Uno o entrambi i servizi non rispondono o superano il timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ERROR, checks: { postgres: OK, redis: ERROR } }

  /api/radios/popular:
    get:
      tags: [Radio]
      summary: Cento radio già disponibili, ordinate per ascolti Audiradio 2025
      description: Catalogo locale con ID e stream verificati. Nazionali e locali sullo stesso periodo annuale; le rilevazioni territoriali distinte mantengono la propria posizione.
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Fonte, periodo, metodo e cento radio ordinate per ascoltatori nel giorno medio
          content:
            application/json:
              schema:
                type: object
                required: [source, sourceUrl, period, metric, note, radios]
                properties:
                  source: { type: string, example: Audiradio }
                  sourceUrl: { type: string, format: uri }
                  period: { type: string }
                  metric: { type: string }
                  note: { type: string }
                  radios:
                    type: array
                    minItems: 100
                    maxItems: 100
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Radio"
                        - type: object
                          required: [rank, listeners]
                          properties:
                            rank: { type: integer, minimum: 1, maximum: 100 }
                            listeners: { type: integer, minimum: 0 }
                            area: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/radios/{id}:
    get:
      tags: [Radio]
      summary: Recupera una radio condivisa tramite ID FM-World
      description: Funziona anche per radio esterne al catalogo iniziale. Metadati e stream sono normalizzati come nella ricerca; risposta conservata in Redis con il TTL configurato.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[1-9]\\d{0,14}$" }
          example: "2626"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Radio con uno stream audio disponibile nei metadati
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radio" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Radio inesistente o senza stream audio nei metadati
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/BadGateway" }

  /api/radios:
    get:
      tags: [Radio]
      summary: Cerca radio su FM-World
      description: Indicare almeno uno fra nome, categoria e paese. I filtri possono essere combinati.
      parameters:
        - name: query
          in: query
          schema: { type: string, minLength: 1 }
          example: Radio 105
        - name: category
          in: query
          description: ID categoria FM-World, per esempio 5 News, 14 Rock, 20 Jazz.
          schema: { type: integer }
        - name: country
          in: query
          description: Codice ISO del paese, per esempio IT o US.
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Radio trovate con stream audio utilizzabile
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radio" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500":
          description: Token FM-World non configurato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504":
          description: Timeout di FM-World
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/radios/interpret:
    post:
      tags: [Radio]
      summary: Converte una richiesta testuale in parametri di ricerca radio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 500 }
            example: { prompt: "Voglio una radio jazz italiana" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Parametri di ricerca generati
          content:
            application/json:
              schema:
                type: object
                required: [query, limit, category, country]
                properties:
                  query: { type: string }
                  limit: { type: integer, minimum: 1, maximum: 50 }
                  category: { type: [integer, "null"] }
                  country:
                    {
                      type: string,
                      description: "Codice ISO del paese oppure stringa vuota",
                    }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503":
          description: Ricerca AI non configurata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/posts:
    get:
      tags: [Notizie]
      summary: Legge le notizie salvate, filtrate per titolo
      parameters:
        - name: title
          in: query
          schema: { type: string }
          description: Filtro testuale senza distinzione tra maiuscole e minuscole
        - name: items
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: Numero massimo di post da restituire
        - name: skip
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Post da saltare per caricare le pagine successive
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Notizie ordinate dalla più recente
          headers:
            X-Total-Count:
              description: Numero totale di notizie che corrispondono al filtro
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/posts/{id}/summary:
    get:
      tags: [Notizie, AI]
      summary: Restituisce il riassunto di una notizia
      description: Riusa il riassunto salvato in PostgreSQL. Se manca, lo genera in italiano in 2–3 frasi tramite il provider configurato e lo salva prima di restituirlo. Richieste contemporanee allo stesso post condividono la generazione nel processo backend.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Riassunto salvato o appena generato
          content:
            application/json:
              schema:
                type: object
                required: [id, summary]
                properties:
                  id: { type: string }
                  summary: { type: string }
        "404":
          description: Notizia non trovata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/posts/events:
    get:
      tags: [Notizie]
      summary: Riceve eventi quando vengono importati nuovi post
      description: Connessione Server-Sent Events. Invia eventi `news` e commenti heartbeat.
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Stream di eventi mantenuto aperto
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          description: Limite massimo di connessioni simultanee raggiunto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/news/ask:
    post:
      tags: [Notizie]
      summary: Risponde a una domanda usando le notizie salvate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
            example: { question: "Quali novità ci sono sulla radio?" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Risposta e notizie usate come fonti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/sync:
    post:
      tags: [Notizie]
      summary: Avvia manualmente la sincronizzazione del feed notizie
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Risultato della sincronizzazione
          content:
            application/json:
              schema:
                type: object
                required: [received, inserted, updated, summarized]
                properties:
                  received: { type: integer }
                  inserted: { type: integer }
                  updated: { type: integer }
                  summarized: { type: integer }
        "409":
          description: Sincronizzazione già in corso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/register:
    post:
      tags: [Account]
      summary: Registra un account e apre una sessione
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationCredentials" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Account creato; imposta il cookie HttpOnly per il rinnovo
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email già registrata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/login:
    post:
      tags: [Account]
      summary: Accede con email e password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Accesso riuscito; imposta il cookie HttpOnly per il rinnovo
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Email o password non corretti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/refresh:
    post:
      tags: [Account]
      summary: Rinnova il token di accesso usando il cookie di sessione
      security: [{ RefreshCookie: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Token rinnovato e cookie ruotato
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Cookie assente, scaduto o già utilizzato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      tags: [Account]
      summary: Chiude la sessione e invalida il cookie di rinnovo
      security: [{ RefreshCookie: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204": { description: Sessione chiusa }

  /api/favorites:
    get:
      tags: [Preferiti]
      summary: Elenca i preferiti dell'utente autenticato
      security: [{ BearerAuth: [] }]
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Preferiti dell'utente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Favorite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Preferiti]
      summary: Aggiunge o aggiorna un preferito
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [radioId, radioName]
              properties:
                radioId: { type: string }
                radioName: { type: string }
                streamUrl: { type: [string, "null"] }
                logoUrl: { type: [string, "null"] }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "201":
          description: Preferito salvato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/favorites/{radioId}:
    delete:
      tags: [Preferiti]
      summary: Rimuove un preferito
      security: [{ BearerAuth: [] }]
      parameters:
        - name: radioId
          in: path
          required: true
          schema: { type: string }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204": { description: Preferito rimosso }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: radiohub_refresh
  headers:
    RefreshCookie:
      description: Cookie HttpOnly usato per rinnovare la sessione
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [OK, ERROR] }
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres: { type: string, enum: [OK, ERROR] }
            redis: { type: string, enum: [OK, ERROR] }
    Error:
      type: object
      properties:
        error: { type: string }
        sourceStatus: { type: integer }
      required: [error]
    Radio:
      type: object
      required: [id, name, logo, genre, country, streamUrl]
      properties:
        id: { type: string }
        name: { type: string }
        logo: { type: [string, "null"], format: uri }
        genre: { type: string }
        country: { type: string }
        streamUrl: { type: string, format: uri }
    PostSummary:
      type: object
      required: [id, title, publishedAt, summary, content, excerpt, imageUrl]
      properties:
        id: { type: string }
        title: { type: string }
        publishedAt: { type: [string, "null"], format: date-time }
        summary: { type: [string, "null"] }
        content:
          {
            type: string,
            description: Testo completo della notizia senza markup HTML,
          }
        imageUrl:
          {
            type: [string, "null"],
            format: uri,
            description: "Prima immagine del contenuto, quando disponibile",
          }
        excerpt: { type: string, description: Anteprima testuale della notizia }
    NewsAnswer:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [id, title, publishedAt]
            properties:
              id: { type: string }
              title: { type: string }
              publishedAt: { type: [string, "null"], format: date-time }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Massimo 72 byte in UTF-8, verificati dal backend.
    RegistrationCredentials:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            password:
              type: string
              minLength: 8
              maxLength: 72
              description: Almeno 8 caratteri e massimo 72 byte in UTF-8. Il limite in byte è verificato dal backend e può consentire meno di 72 caratteri se sono multibyte.
    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: JWT di accesso a breve durata }
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string, format: email }
    Favorite:
      type: object
      required: [userId, radioId, radioName, streamUrl, logoUrl, createdAt]
      properties:
        userId: { type: string }
        radioId: { type: string }
        radioName: { type: string }
        streamUrl: { type: [string, "null"] }
        logoUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Parametri o corpo della richiesta non validi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Autenticazione richiesta o token non valido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Origine della richiesta non consentita dalla configurazione CORS.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Origine non consentita" }
    TooManyRequests:
      description: Limite di richieste superato
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Errore del servizio esterno o del provider AI
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Errore interno del backend
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
