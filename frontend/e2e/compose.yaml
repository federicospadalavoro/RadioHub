services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: radiohub_e2e
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: radiohub_e2e
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiohub_e2e -d radiohub_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
