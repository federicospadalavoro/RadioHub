services:
  - type: web
    name: radiohub
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: >-
      npm ci --prefix backend --include=dev &&
      npm ci --prefix frontend --include=dev &&
      cd backend && npx prisma generate && npm run build &&
      cd ../frontend && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SERVICE_TIMEOUT_MS
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FM_WORLD_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: radiohub-cache
          property: connectionString
  - type: keyvalue
    name: radiohub-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
